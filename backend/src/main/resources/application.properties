spring.application.name=commerce-sales-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/commerce_sales}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes. Hibernate validates mappings but never mutates tables.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing CSFP prototype schema
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET}

# First-owner bootstrap is disabled unless explicitly enabled at deployment.
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.owner-email=${APP_BOOTSTRAP_OWNER_EMAIL:}
app.bootstrap.owner-password=${APP_BOOTSTRAP_OWNER_PASSWORD:}
app.bootstrap.tenant-name=${APP_BOOTSTRAP_TENANT_NAME:Demo Tenant}

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.token=${ML_SERVICE_TOKEN}
