spring.application.name=commerce-sales-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/commerce_sales}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET}

app.demo.username=${APP_DEMO_USERNAME}
app.demo.password=${APP_DEMO_PASSWORD}
app.demo.tenant-id=${APP_DEMO_TENANT_ID}

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.token=${ML_SERVICE_TOKEN}
