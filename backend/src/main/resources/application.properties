spring.application.name=sales-service

spring.datasource.url=jdbc:postgresql://localhost:5432/quickbooks
spring.datasource.username=quickbooks
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.jwt.secret=${JWT_SECRET}

app.demo.username=${APP_DEMO_USERNAME}
app.demo.password=${APP_DEMO_PASSWORD}

ml.service.url=http://localhost:8000
ml.service.token=${ML_SERVICE_TOKEN}
